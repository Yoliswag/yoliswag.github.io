<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor v1.0</title>
    <style>
        body {
            background-color: #c0c0c0;
            font-family: "MS Sans Serif", Arial, sans-serif;
            margin: 20px;
            color: #000;
        }
        .window {
            background-color: #c0c0c0;
            border: 2px outset #fff;
            box-shadow: 2px 2px 0 #000;
            max-width: 600px;
            margin: 0 auto;
        }
        .title-bar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: #fff;
            padding: 3px 5px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            padding: 15px;
        }
        .control-group {
            background-color: #c0c0c0;
            border: 2px groove #fff;
            padding: 10px;
            margin-bottom: 15px;
        }
        .control-group legend {
            font-weight: bold;
            padding: 0 5px;
        }
        label {
            display: inline-block;
            width: 120px;
            font-size: 12px;
        }
        input[type="range"] {
            width: 200px;
            vertical-align: middle;
        }
        .value-display {
            display: inline-block;
            width: 50px;
            text-align: right;
            font-family: "Courier New", monospace;
            font-weight: bold;
        }
        button {
            background-color: #c0c0c0;
            border: 2px outset #fff;
            padding: 5px 15px;
            font-family: "MS Sans Serif", Arial, sans-serif;
            font-size: 12px;
            cursor: pointer;
            margin: 5px;
        }
        button:active {
            border-style: inset;
        }
        .canvas-container {
            text-align: center;
            margin: 15px 0;
            background-color: #fff;
            border: 2px inset #808080;
            padding: 10px;
            min-height: 200px;
        }
        canvas {
            max-width: 100%;
            image-rendering: pixelated;
        }
        .status-bar {
            background-color: #c0c0c0;
            border-top: 2px groove #fff;
            padding: 3px 5px;
            font-size: 11px;
        }
        #fileInput {
            margin: 10px 0;
        }
        h2 {
            font-size: 16px;
            margin: 0 0 10px 0;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>Image Compressor v1.0</span>
            <span>_□X</span>
        </div>
        <div class="content">
            <h2>Load Image:</h2>
            <input type="file" id="fileInput" accept="image/*">
            
            <fieldset class="control-group">
                <legend>Compression Settings</legend>
                
                <div style="margin: 10px 0;">
                    <label>Quality:</label>
                    <input type="range" id="quality" min="1" max="100" value="10">
                    <span class="value-display" id="qualityVal">10</span>
                </div>
                
                <div style="margin: 10px 0;">
                    <label>Scale:</label>
                    <input type="range" id="scale" min="10" max="100" value="50">
                    <span class="value-display" id="scaleVal">50%</span>
                </div>
                
                <div style="margin: 10px 0;">
                    <label>Saturation:</label>
                    <input type="range" id="saturation" min="0" max="200" value="120">
                    <span class="value-display" id="saturationVal">120%</span>
                </div>
            </fieldset>
            
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
            
            <div style="text-align: center;">
                <button id="downloadBtn">Download Image</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>
        <div class="status-bar">
            <span id="status">Ready</span>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const qualitySlider = document.getElementById('quality');
        const scaleSlider = document.getElementById('scale');
        const saturationSlider = document.getElementById('saturation');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const status = document.getElementById('status');
        
        let originalImage = null;
        
        qualitySlider.addEventListener('input', (e) => {
            document.getElementById('qualityVal').textContent = e.target.value;
            processImage();
        });
        
        scaleSlider.addEventListener('input', (e) => {
            document.getElementById('scaleVal').textContent = e.target.value + '%';
            processImage();
        });
        
        saturationSlider.addEventListener('input', (e) => {
            document.getElementById('saturationVal').textContent = e.target.value + '%';
            processImage();
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        originalImage = img;
                        processImage();
                        status.textContent = 'Image loaded: ' + file.name;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        
        function processImage() {
            if (!originalImage) return;
            
            const scale = scaleSlider.value / 100;
            const quality = qualitySlider.value / 100;
            const saturation = saturationSlider.value / 100;
            
            canvas.width = originalImage.width * scale;
            canvas.height = originalImage.height * scale;
            
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                const gray = 0.299 * r + 0.587 * g + 0.114 * b;
                
                data[i] = gray + (r - gray) * saturation;
                data[i + 1] = gray + (g - gray) * saturation;
                data[i + 2] = gray + (b - gray) * saturation;
            }
            
            ctx.putImageData(imageData, 0, 0);
        }
        
        downloadBtn.addEventListener('click', () => {
            if (!originalImage) {
                alert('Please load an image first!');
                return;
            }
            
            const quality = qualitySlider.value / 100;
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'compressed_image.jpg';
                a.click();
                URL.revokeObjectURL(url);
                status.textContent = 'Image downloaded';
            }, 'image/jpeg', quality);
        });
        
        resetBtn.addEventListener('click', () => {
            qualitySlider.value = 10;
            scaleSlider.value = 50;
            saturationSlider.value = 120;
            document.getElementById('qualityVal').textContent = '10';
            document.getElementById('scaleVal').textContent = '50%';
            document.getElementById('saturationVal').textContent = '120%';
            processImage();
            status.textContent = 'Settings reset';
        });
    </script>
</body>
</html>
