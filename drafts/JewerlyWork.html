  .hover-effect-container {
  position: relative;
  display: block;
  max-width: 100%;
  margin: 10px auto;
  cursor: pointer;
}

.hover-effect-container img {
  display: block;
  max-width: 100%;
  margin: 0; /* Reset margin since the container has margin */
  transition: all 0.3s ease;
}

/* Overlay that appears on hover */
.hover-effect-container::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 110%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.6); /* Gray overlay with 60% opacity */
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.hover-effect-container:hover::after {
  opacity: 1;
}

/* Optional: Add a text indicator for clickable images */
.hover-effect-container::before {
  content: 'CLICK';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgb(0, 255, 60);
  font-weight: bold;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.hover-effect-container:hover::before {
  opacity: 1;
}

  .back-button {
