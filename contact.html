<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Contact | Yolitzy.com</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Courier New", Courier, monospace;
            color: #ff00ff;
        }

        .family {
            width: 100%;
            height: 100px;
            overflow: hidden;
        }

        .navbar {
            width: 100%;
            max-width: 1400px;
            border-bottom: 1px solid rgb(249, 255, 72);
            padding-bottom: 22px;
            margin-bottom: 18px;
        }

        .welcome {
            font-size: 60px;
            color: red;
            font-weight: bold;
            text-align: center;
            padding: 50px 0px 50px;
        }

        .welcome a,
        .welcome a:visited,
        .welcome a:hover,
        .welcome a:active {
            color: red;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            background: #0b76ff;
            gap: 14px;
            font-size: 18px;
            font-weight: bold;
            padding: 0 20px;
        }

        .nav-links a,
        .nav-links a:visited {
            color: #000000;
            text-decoration: none;
            border: 1px solid #0b76ff;
            padding: 10px 16px;
            border-radius: 0;
        }

        .nav-links a:hover,
        .nav-links a:focus-visible {
            background: #70ff8d;
            color: #000000;
            outline: none;
        }

        .contact-wrap {
            width: 100%;
            max-width: 900px;
            border: 1px solid #ff00ff;
            background: #050505;
            padding: 24px;
            margin-top: 18px;
        }

        h1 {
            margin-top: 0;
            color: #ff00ff;
            text-shadow: 2px 2px 5px #236823;
        }

        p {
            color: #8bd8ff;
            line-height: 1.6;
        }

        .contact-link,
        .contact-link:visited {
            color: #70ff8d;
            text-decoration: none;
            font-weight: bold;
        }

        .contact-link:hover,
        .contact-link:focus-visible {
            text-decoration: underline;
            outline: none;
        }

        @media (max-width: 768px) {
            .welcome {
                font-size: 44px;
                padding: 30px 0 20px;
            }

            .nav-links {
                font-size: 16px;
                gap: 10px;
            }

            .nav-links a {
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>
    <img class="family" src="/play/photos/family.gif" alt="Overlay Image">

    <div class="navbar">
        <div class="welcome"><a href="/index.html">Yolitzy.com</a></div>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="/about.html">About Me</a>
            <a href="/portfolio.html">Portfolio</a>
            <a href="/cv.html">CV</a>
            <a href="/contact.html">Contact</a>
            <a href="/archive/index.html">Archive</a>
        </nav>
    </div>

    <main class="contact-wrap">
        <h1>Contact</h1>
        <p>
            For collaborations, commissions, or questions, email:
            <a class="contact-link" href="mailto:hello@yolitzy.com">hello@yolitzy.com</a>
        </p>
    </main>
</body>
</html>
