  .hover-effect-container {
  position: relative;
  display: block;
  max-width: 100%;
  margin: 10px auto;
  cursor: pointer;
}

.hover-effect-container img {
  display: block;
  max-width: 100%;
  margin: 0; /* Reset margin since the container has margin */
  transition: all 0.3s ease;
}

/* Overlay that appears on hover */
.hover-effect-container::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 110%;
  height: 100%;
  background-color: rgba(255, 49, 231, 0.6); /* Gray overlay with 60% opacity */
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.hover-effect-container:hover::after {
  opacity: 1;
}

/* Optional: Add a text indicator for clickable images */
.hover-effect-container::before {
  content: 'CLICK';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgb(0, 255, 60);
  font-weight: bold;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.hover-effect-container:hover::before {
  opacity: 1;
}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>

<script>
async function loadPortfolio() {
    // Your photos data with custom titles and descriptions
    const photosData = [
        {
            "file": "DSC_0245.jpg",
            "title": "Friend",
            "description": "From Get Lost collection"
        },
        {
            "file": "webcam-toy-photo39.jpg",
            "title": "",
            "description": ""
        },
        {
            "file": "webcam-toy-photo40.jpg",
            "title": "",
            "description": ""
        },
        {
            "file": "high.jpg",
            "title": "",
            "description": ""
        },
        {
            "file": "Studio Session-087-1.png",
            "title": "my tongue",
            "description": ""
        }
        
    ];
    
    const container = document.getElementById('portfolio');
    const items = [];
    
    // Function to load image and extract EXIF date
    const loadImageWithEXIF = (photoData) => {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = `/play/photos/${photoData.file}`;
            
            img.onload = function() {
                EXIF.getData(img, function() {
                    // Get the original date photo was taken
                    const dateTimeOriginal = EXIF.getTag(this, "DateTimeOriginal");
                    const dateTime = EXIF.getTag(this, "DateTime");
                    
                    let photoDate;
                    let dateString;
                    
                    if (dateTimeOriginal) {
                        // EXIF date format: "2024:02:01 14:30:25"
                        const parts = dateTimeOriginal.split(' ');
                        const datePart = parts[0].replace(/:/g, '-');
                        const timePart = parts[1];
                        photoDate = new Date(`${datePart}T${timePart}`);
                        dateString = photoDate.toLocaleString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    } else if (dateTime) {
                        const parts = dateTime.split(' ');
                        const datePart = parts[0].replace(/:/g, '-');
                        const timePart = parts[1];
                        photoDate = new Date(`${datePart}T${timePart}`);
                        dateString = photoDate.toLocaleString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                    } else {
                        photoDate = new Date();
                        dateString = "";
                    }
                    
                    resolve({
                        file: photoData.file,
                        title: photoData.title,
                        description: photoData.description,
                        date: photoDate,
                        dateString: dateString
                    });
                });
            };
            
            img.onerror = () => {
                resolve({
                    file: photoData.file,
                    title: photoData.title,
                    description: photoData.description,
                    date: new Date(),
                    dateString: "Date unknown"
                });
            };
        });
    };
    
    // Load all images with EXIF data
    for (const photoData of photosData) {
        const item = await loadImageWithEXIF(photoData);
        items.push(item);
    }
    
    // Sort by date (newest first)
    items.sort((a, b) => b.date - a.date);
    
    // Display items
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'portfolio-item';
        
        div.innerHTML = `
            <img src="/play/photos/${item.file}" alt="${item.title}">
            <h2>${item.title}</h2>
            <h2>${item.file}</h2>
            <p><em>${item.dateString}</em></p>
            <p>${item.description}</p>
        `;
        
        container.appendChild(div);
    });
}

// Load portfolio when page loads
loadPortfolio();
</script>
