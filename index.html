 text-align: center; /* Center text within each gallery item */

  .hover-effect-container {
  position: relative;
  display: block;
  max-width: 100%;
  margin: 10px auto;
  cursor: pointer;
}

.hover-effect-container img {
  display: block;
  max-width: 100%;
  margin: 0; /* Reset margin since the container has margin */
  transition: all 0.3s ease;
}

/* Overlay that appears on hover */
.hover-effect-container::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 110%;
  height: 100%;
  background-color: rgba(255, 49, 231, 0.6); /* Gray overlay with 60% opacity */
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}

.hover-effect-container:hover::after {
  opacity: 1;
}

/* Optional: Add a text indicator for clickable images */
.hover-effect-container::before {
  content: 'CLICK';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: rgb(0, 255, 60);
  font-weight: bold;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.hover-effect-container:hover::before {
  opacity: 1;
}

  .back-button {
    display: inline-block;
    background-color: #fff826;
    color: #000;
    padding: 10px 20px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
    text-transform: uppercase;
    box-shadow: 2px 2px 4px #000;
    margin-top: 20px;
    margin-bottom: 30px;
  }
  .back-button:hover {
    background-color: #ffdf4d;
  }
  .zoom-on-click img {
    transition: 0.3s ease;

  }

  .zoom-on-click img.clicked {

  }
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    justify-content: center;
    align-items: center;

  }

  }

max-width: 100%;
border-bottom: 1px solid gray;

.dropdown {

.dropdown-content {

      <script>
        async function loadPortfolio() {
          const res = await fetch('portfolio/data.json');
          const items = await res.json();
    
          // sort by date (newest first)
          items.sort((a, b) => new Date(b.date) - new Date(a.date));
    
          const container = document.getElementById('portfolio');
          items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'portfolio-item';
    
            div.innerHTML = `
              ${item.file.endsWith('.jpg') || item.file.endsWith('.png') 
                ? `<img src="portfolio/${item.file}" alt="${item.title}">`
                : `<a href="portfolio/${item.file}" target="_blank">View File</a>`}
              <h2>${item.title}</h2>
              <p><em>${item.date}</em></p>
              <p>${item.description}</p> <br><br>
            `;
    
            container.appendChild(div);
          });
        }
    
        loadPortfolio();
      </script>
