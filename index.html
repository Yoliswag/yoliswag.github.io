<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Yolitzy.com</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Courier New", Courier, monospace;
            color: #000000;
        }

        /* ── NAV ── */
        .navbar {
            width: 100%;
            max-width: 1400px;

        }

        .welcome {
            font-size: 60px;
            font-weight: bold;
            text-align: center;
            padding: 50px 0px 50px;
        }
.welcome a,
        .welcome a:visited,
        .welcome a:hover,
        .welcome a:active {
            color: #ff00ff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0.8;
            gap: 14px;
            font-size: 18px;
            font-weight: bold;
            padding: 0 20px;
        }

        .nav-links a {
            color: #000000;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 0;
        }

        .nav-links a:visited {
            color: #000000;
        }

        .nav-links a:hover,
        .nav-links a:focus-visible {
            background: #70ff8d;
            color: #000000;
            outline: none;
        }

        .nav-links a.active {
            background: #70ff8d;
            color: #000000;
        }

        /* ── INTRO ── */
        .intro-section {
            width: 100%;
            max-width: 1400px;
            font-size: 26px;
            color: #ff00ff;
            padding: 60px 60px 40px;
            line-height: 1.8;
        }

        /* ── RECENT WORK ── */
        .recent-header {
            width: 100%;
            max-width: 1400px;
            font-size: 13px;
            color: #000000;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 30px 60px 14px; 
            font-weight: 400;
        }

        /* ── GALLERY ── */
        .gallery-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin-top: 20px;
        }

        .image-wrapper {
            position: absolute;
            cursor: pointer;
        }

        .gallery-item {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            -webkit-user-select: none;
            user-select: none;
        }

        /* ── FULLSCREEN ── */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-overlay.active {
            display: flex;
        }

        .fullscreen-overlay img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
        }

        /* ── HIT COUNTER ── */
        .hit-counter {
            width: 100%;
            max-width: 1400px;
            text-align: center;
            padding: 40px 0 20px;
            font-size: 13px;
            color: #000000;
            letter-spacing: 0.15em;
            border-top: 1px solid #333;
            margin-top: 40px;
        }

        .counter-display {
            font-size: 18px;
            font-family: "Courier New", monospace;
            letter-spacing: 0.2em;
            margin-top: 6px;
        }



        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .welcome {
                font-size: 44px;
                padding: 30px 0 20px;
            }
            .nav-links {
                font-size: 16px;
                gap: 10px;
            }
            .nav-links a {
                padding: 8px 14px;
            }
            .intro-section {
                font-size: 20px;
                padding: 40px 20px 30px;
            }
            .recent-header {
                padding: 20px 20px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="welcome"><a href="/index.html">Yolitzy.com</a></div>
        <nav class="nav-links" aria-label="Main navigation">
            <a href="/about.html">About Me</a>
            <a href="/portfolio.html">Portfolio</a>
            <a href="/web-design.html">Web Design</a>
            <a href="/archive/index.html">Archive</a>
        </nav>
    </div>

    <!-- INTRO -->
    <div class="intro-section">
        <!-- replace this with your actual intro -->
        Photographer, Editor, Graphic Designer, Web Designer and illustrator based in Lexington, Kentucky<br>
    </div>

    <!-- RECENT WORK LABEL -->
    <div class="recent-header">Recent Work</div>

    <!-- GALLERY (6 newest images) -->
    <div class="gallery-container" id="gallery">
        <div class="image-wrapper" data-index="0" style="aspect-ratio: 3872/2592; min-height: 133px;"><img src="archive/unsorted/bedgirl.jpg" alt="" class="gallery-item" loading="lazy" decoding="async" fetchpriority="low"></div>
        <div class="image-wrapper" data-index="1" style="aspect-ratio: 1500/1000; min-height: 133px;"><img src="archive/unsorted/yoli_1_.jpg" alt="" class="gallery-item" loading="lazy" decoding="async" fetchpriority="low"></div>
        <div class="image-wrapper" data-index="2" style="aspect-ratio: 2592/3872; min-height: 200px;"><img src="archive/unsorted/party weave_0004.jpg" alt="" class="gallery-item" loading="lazy" decoding="async" fetchpriority="low"></div>
        <div class="image-wrapper" data-index="4" style="aspect-ratio: 1500/1000; min-height: 133px;"><img src="archive/unsorted/yoli5-915e.jpg" alt="" class="gallery-item" loading="lazy" decoding="async" fetchpriority="low"></div>
        <div class="image-wrapper" data-index="5" style="aspect-ratio: 1500/1000; min-height: 133px;"><img src="archive/unsorted/yoli_3_smiley.jpg" alt="" class="gallery-item" loading="lazy" decoding="async" fetchpriority="low"></div>
    </div>

    <div style="width:100%; max-width:1400px; text-align:right; padding: 12px 0;">
        <a href="/portfolio.html" style="color:#000000; font-size:13px; letter-spacing:0.08em;">all work →</a>
    </div>

    <!-- HIT COUNTER -->
    <div class="hit-counter">
        <div>visits</div>
        <div class="counter-display" id="counter-display">[ loading ]</div>
    </div>

    <!-- FULLSCREEN OVERLAY -->
    <div class="fullscreen-overlay" id="fullscreen">
        <img src="" alt="">
    </div>


    <script>
        // ── GALLERY LAYOUT ──
        const gallery = document.getElementById('gallery');
        const wrappers = document.querySelectorAll('.image-wrapper');
        const fullscreenOverlay = document.getElementById('fullscreen');
        const fullscreenImg = fullscreenOverlay.querySelector('img');

        function getAspectRatio(img, wrapper) {
            if (img.naturalWidth > 0 && img.naturalHeight > 0) {
                return img.naturalWidth / img.naturalHeight;
            }

            const ratioSource = wrapper.style.aspectRatio || getComputedStyle(wrapper).aspectRatio;
            if (ratioSource && ratioSource.includes('/')) {
                const parts = ratioSource.split('/').map((part) => parseFloat(part.trim()));
                if (parts[0] > 0 && parts[1] > 0) {
                    return parts[0] / parts[1];
                }
            }

            return 1;
        }

        function layoutImages() {
            const width = window.innerWidth;
            const columns = width > 1024 ? 3 : 2;
            const gap = 20;
            const containerWidth = Math.min(1400, width - 40);
            const effectiveWidth = containerWidth - (gap * (columns - 1));
            const colWidth = Math.floor(effectiveWidth / columns);
            const columnHeights = Array(columns).fill(0);
            gallery.style.width = containerWidth + 'px';

            wrappers.forEach((wrapper) => {
                const img = wrapper.querySelector('.gallery-item');
                const ratio = getAspectRatio(img, wrapper);
                const height = colWidth / ratio;
                const shortestColumn = columnHeights.indexOf(Math.min(...columnHeights));
                const x = shortestColumn * (colWidth + gap);
                const y = columnHeights[shortestColumn];

                wrapper.style.width = colWidth + 'px';
                wrapper.style.height = height + 'px';
                wrapper.style.left = x + 'px';
                wrapper.style.top = y + 'px';

                columnHeights[shortestColumn] += height + gap;
            });

            gallery.style.height = Math.max(...columnHeights) + 'px';
        }

        layoutImages();
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(layoutImages, 250);
        });
        wrappers.forEach((wrapper) => {
            const img = wrapper.querySelector('.gallery-item');
            img.addEventListener('load', layoutImages, { once: true });
        });

        // ── FULLSCREEN ──
        wrappers.forEach((wrapper) => {
            const img = wrapper.querySelector('.gallery-item');

            wrapper.addEventListener('click', () => {
                // Prefer the 1200px optimized JPG for fullscreen when available
                const original = img.getAttribute('data-original') || img.src;
                const name = original.split('/').pop().replace(/\.[^.]+$/, '');
                fullscreenImg.src = `archive/unsorted/optimized/${name}-1200.jpg`;
                fullscreenOverlay.classList.add('active');
            });
        });

        fullscreenOverlay.addEventListener('click', () => {
            fullscreenOverlay.classList.remove('active');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') fullscreenOverlay.classList.remove('active');
        });

        // Enhance gallery images to use optimized responsive sources
        function enhanceImages() {
            wrappers.forEach((wrapper) => {
                if (wrapper.querySelector('picture')) return; // already enhanced
                const img = wrapper.querySelector('.gallery-item');
                const originalSrc = img.getAttribute('src');
                img.setAttribute('data-original', originalSrc);
                const filename = originalSrc.split('/').pop();
                const basename = filename.replace(/\.[^.]+$/, '');

                const picture = document.createElement('picture');
                const sourceWebp = document.createElement('source');
                sourceWebp.type = 'image/webp';
                sourceWebp.srcset = `archive/unsorted/optimized/${basename}-800.webp 800w, archive/unsorted/optimized/${basename}-1200.webp 1200w`;
                sourceWebp.sizes = '(max-width: 1024px) 50vw, 33vw';

                // set img fallback targets
                img.src = `archive/unsorted/optimized/${basename}-800.jpg`;
                img.srcset = `archive/unsorted/optimized/${basename}-800.jpg 800w, archive/unsorted/optimized/${basename}-1200.jpg 1200w`;
                img.sizes = '(max-width: 1024px) 50vw, 33vw';

                picture.appendChild(sourceWebp);
                picture.appendChild(img.cloneNode(true));

                // replace existing img with picture
                wrapper.removeChild(img);
                wrapper.appendChild(picture);
            });
        }

        // Run enhance after initial layout and when images load
        enhanceImages();
        wrappers.forEach((wrapper) => {
            const picImg = wrapper.querySelector('.gallery-item');
            picImg.addEventListener('load', layoutImages, { once: true });
        });

        // ── HIT COUNTER ──
        // Uses CounterAPI v1 endpoint format: /v1/:namespace/:name/up
        const COUNTER_NAMESPACE = 'yolitzy';
        const COUNTER_NAME = 'main';
        const counterEl = document.getElementById('counter-display');

        fetch(`https://api.counterapi.dev/v1/${COUNTER_NAMESPACE}/${COUNTER_NAME}/up`)
            .then(r => {
                if (!r.ok) throw new Error('Counter request failed');
                return r.json();
            })
            .then(data => {
                const count = String(data.count).padStart(7, '0');
                counterEl.textContent = `[ ${count} ]`;
            })
            .catch(() => {
                counterEl.textContent = '[ error ]';
            });

        document.addEventListener("DOMContentLoaded", function() {
            const links = document.querySelectorAll('.nav-links a');
            const currentUrl = window.location.href;

            links.forEach(link => {
                if (link.href === currentUrl) {
                    link.classList.add('active');
                }
            });
        });
    </script>

</body>
</html>
