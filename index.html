<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #000000;
            display: flex;
            justify-content: center;
            touch-action: none;
        }
        .gallery-container {
            position: relative;
            max-width: 1400px;
            width: 100%;
        }
        
        .image-wrapper {
            position: absolute;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        
        .image-wrapper:hover {
            border-color: #ddd;
        }
        
        .image-wrapper.active {
            border-color: #666;
            z-index: 1000 !important;
        }
        
        .gallery-item {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            cursor: move;
            pointer-events: none;
        }
        
          
        .image-wrapper:hover .gallery-item {
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        
        .image-wrapper.dragging {
            opacity: 0.5;
        }
        
        /* Resize handle */
        .resize-handle {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            cursor: nwse-resize;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        
        .image-wrapper:hover .resize-handle,
        .image-wrapper.active .resize-handle {
            opacity: 1;
        }
        
        /* Fullscreen overlay */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: 10000;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        .fullscreen-overlay.active {
            display: flex;
        }
        .fullscreen-overlay img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        
        /* Instructions */
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 14px;
            z-index: 5000;
        }

        .navbar {
            max-width: 100%;
            border-bottom: 1px solid gray;
        } 

        .welcome {
            font-size: 60px;
            color: red;
            font-weight: bold;
            text-align: left;
            padding: 50px 130px 50px;
        }
    </style>
</head>

    <!-- Fullscreen overlay -->
    <div class="fullscreen-overlay" id="fullscreen">
        <img src="" alt="">
    </div>
    
    <script>
        const gallery = document.getElementById('gallery');
        const wrappers = document.querySelectorAll('.image-wrapper');
        const fullscreenOverlay = document.getElementById('fullscreen');
        const fullscreenImg = fullscreenOverlay.querySelector('img');
        
        // Set gallery height based on images
        gallery.style.minHeight = '7000px';
        
        // Adjust positions after images load for better packing
        const columnHeights = [0, 0, 0, 0, 0];
        const columnWidth = 270;
        
        wrappers.forEach((wrapper, index) => {
            const img = wrapper.querySelector('.gallery-item');
            const resizeHandle = wrapper.querySelector('.resize-handle');
            
            img.onload = function() {
                const col = parseInt(wrapper.dataset.col);
                const aspectRatio = img.naturalWidth / img.naturalHeight;
                const height = 250 / aspectRatio;
                
                wrapper.style.top = columnHeights[col] + 'px';
                wrapper.style.height = height + 'px';
                columnHeights[col] += height + 20;
                
                // Update gallery height
                const maxHeight = Math.max(...columnHeights);
                gallery.style.minHeight = maxHeight + 'px';
            };
            
            let isDragging = false;
            let isResizing = false;
            let hasMoved = false;
            let offsetX, offsetY;
            let startX, startY, startWidth, startHeight;
            let lastTap = 0;
            
            // Touch support for pinch zoom
            let initialDistance = 0;
            let initialWidth = 0;
            
            // Dragging
            wrapper.addEventListener('mousedown', (e) => {
                if (e.target === resizeHandle) return;
                isDragging = true;
                hasMoved = false;
                wrapper.classList.add('dragging');
                wrapper.classList.add('active');
                offsetX = e.clientX - wrapper.offsetLeft;
                offsetY = e.clientY - wrapper.offsetTop;
                wrapper.style.zIndex = 1000;
                e.preventDefault();
            });
            
            wrapper.addEventListener('touchstart', (e) => {
                if (e.target === resizeHandle) return;
                
                // Double-tap detection
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    // Double tap - show fullscreen
                    fullscreenImg.src = img.src;
                    fullscreenOverlay.classList.add('active');
                    e.preventDefault();
                    return;
                }
                lastTap = currentTime;
                
                if (e.touches.length === 2) {
                    // Two finger pinch to zoom
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    initialDistance = Math.hypot(
                        touch2.clientX - touch1.clientX,
                        touch2.clientY - touch1.clientY
                    );
                    initialWidth = wrapper.offsetWidth;
                    wrapper.classList.add('active');
                } else if (e.touches.length === 1) {
                    // Single finger drag
                    isDragging = true;
                    hasMoved = false;
                    wrapper.classList.add('dragging');
                    wrapper.classList.add('active');
                    const touch = e.touches[0];
                    offsetX = touch.clientX - wrapper.offsetLeft;
                    offsetY = touch.clientY - wrapper.offsetTop;
                    wrapper.style.zIndex = 1000;
                }
            });
            
            // Resize handle
            resizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                wrapper.classList.add('active');
                startX = e.clientX;
                startY = e.clientY;
                startWidth = wrapper.offsetWidth;
                startHeight = wrapper.offsetHeight;
                wrapper.style.zIndex = 1000;
                e.stopPropagation();
                e.preventDefault();
            });
            
            resizeHandle.addEventListener('touchstart', (e) => {
                isResizing = true;
                wrapper.classList.add('active');
                const touch = e.touches[0];
                startX = touch.clientX;
                startY = touch.clientY;
                startWidth = wrapper.offsetWidth;
                startHeight = wrapper.offsetHeight;
                wrapper.style.zIndex = 1000;
                e.stopPropagation();
                e.preventDefault();
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    hasMoved = true;
                    wrapper.style.left = (e.clientX - offsetX) + 'px';
                    wrapper.style.top = (e.clientY - offsetY) + 'px';
                } else if (isResizing) {
                    const deltaX = e.clientX - startX;
                    const newWidth = Math.max(100, startWidth + deltaX);
                    const aspectRatio = img.naturalWidth / img.naturalHeight;
                    const newHeight = newWidth / aspectRatio;
                    
                    wrapper.style.width = newWidth + 'px';
                    wrapper.style.height = newHeight + 'px';
                }
            });
            
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && initialDistance > 0) {
                    // Pinch zoom
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    const currentDistance = Math.hypot(
                        touch2.clientX - touch1.clientX,
                        touch2.clientY - touch1.clientY
                    );
                    const scale = currentDistance / initialDistance;
                    const newWidth = Math.max(100, initialWidth * scale);
                    const aspectRatio = img.naturalWidth / img.naturalHeight;
                    const newHeight = newWidth / aspectRatio;
                    
                    wrapper.style.width = newWidth + 'px';
                    wrapper.style.height = newHeight + 'px';
                    e.preventDefault();
                } else if (isDragging && e.touches.length === 1) {
                    hasMoved = true;
                    const touch = e.touches[0];
                    wrapper.style.left = (touch.clientX - offsetX) + 'px';
                    wrapper.style.top = (touch.clientY - offsetY) + 'px';
                }
            });
            
            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    wrapper.classList.remove('dragging');
                    wrapper.classList.remove('active');
                    wrapper.style.zIndex = 1;
                } else if (isResizing) {
                    isResizing = false;
                    wrapper.classList.remove('active');
                    wrapper.style.zIndex = 1;
                }
            });
            
            document.addEventListener('touchend', () => {
                isDragging = false;
                isResizing = false;
                initialDistance = 0;
                wrapper.classList.remove('dragging');
                wrapper.classList.remove('active');
                wrapper.style.zIndex = 1;
            });
            
            // Double-click for fullscreen (desktop)
            wrapper.addEventListener('dblclick', (e) => {
                if (!hasMoved) {
                    fullscreenImg.src = img.src;
                    fullscreenOverlay.classList.add('active');
                }
            });
        });
        
        // Click overlay to close fullscreen
        fullscreenOverlay.addEventListener('click', () => {
            fullscreenOverlay.classList.remove('active');
        });
        
        // Press Escape to close fullscreen
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                fullscreenOverlay.classList.remove('active');
            }
        });
    </script>
