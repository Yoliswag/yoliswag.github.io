<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #000000;
            display: flex;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .gallery-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
        }
        
        .image-wrapper {
            position: absolute;
        }
        
        .gallery-item {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Fullscreen overlay */
        .fullscreen-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10000;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        
        .fullscreen-overlay.active {
            display: flex;
        }
        
        .fullscreen-overlay img {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 13px;
            z-index: 5000;
            max-width: 90vw;
            text-align: center;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }
            .instructions {
                font-size: 12px;
                padding: 1px 1px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px;
            }
            .instructions {
                font-size: 11px;
                padding: 1px 1px;
            }
        }
    </style>
</head>
<body>

        <div class="image-wrapper" data-index="0" style="aspect-ratio: 3872/2592; min-height: 133px;"><img src="portfolio/Photography/_DSC7672.JPG" alt="" class="gallery-item" loading="lazy"></div>

    <div class="fullscreen-overlay" id="fullscreen">
        <img src="" alt="">
    </div>
    
    <script>
        const gallery = document.getElementById('gallery');
        const wrappers = document.querySelectorAll('.image-wrapper');
        const fullscreenOverlay = document.getElementById('fullscreen');
        const fullscreenImg = fullscreenOverlay.querySelector('img');
        
        function layoutImages() {
            const width = window.innerWidth;
            const columns = width > 1024 ? 5 : 2;
            const gap = 20;
            const containerWidth = Math.min(1400, width - 40);
            const effectiveWidth = containerWidth - (gap * (columns - 1));
            const colWidth = Math.floor(effectiveWidth / columns);
            const columnHeights = Array(columns).fill(0);
            gallery.style.width = containerWidth + 'px';
            
            wrappers.forEach((wrapper, index) => {
                const img = wrapper.querySelector('.gallery-item');
                const col = index % columns;
                const x = col * (colWidth + gap);
                const y = columnHeights[col];
                
                function applyDimensions() {
                    const aspectRatio = img.naturalWidth / img.naturalHeight;
                    const height = colWidth / aspectRatio;
                    wrapper.style.width = colWidth + 'px';
                    wrapper.style.height = height + 'px';
                    wrapper.style.left = x + 'px';
                    wrapper.style.top = y + 'px';
                    columnHeights[col] += height + 20;
                    gallery.style.height = Math.max(...columnHeights) + 'px';
                }
                
                if (img.complete && img.naturalWidth > 0) {
                    applyDimensions();
                } else {
                    img.onload = applyDimensions;
                }
            });
        }
        
        layoutImages();
        
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(layoutImages, 250);
        });
        
        wrappers.forEach((wrapper) => {
            const img = wrapper.querySelector('.gallery-item');
            let lastTap = 0;
            
            wrapper.addEventListener('touchstart', () => {
                const currentTime = new Date().getTime();
                if (currentTime - lastTap < 300) {
                    fullscreenImg.src = img.src;
                    fullscreenOverlay.classList.add('active');
                    lastTap = 0;
                } else {
                    lastTap = currentTime;
                }
            });
            
            wrapper.addEventListener('dblclick', () => {
                fullscreenImg.src = img.src;
                fullscreenOverlay.classList.add('active');
            });
        });
        
        fullscreenOverlay.addEventListener('click', () => {
            fullscreenOverlay.classList.remove('active');
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                fullscreenOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
